<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>AnimeVerse</h1>
        <p>Test your anime knowledge!</p>
    </header>

    <main>
        <section class="quiz-container">
            <h2>Anime Trivia Quiz</h2>

            <p id="question-number">Question 1</p>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <h3 id="question">Who is the main character of Naruto?</h3>

            <div id="answer-choices" class="answer-choices">
                <!-- Answer choices will appear here -->
            </div>

            <button id="submit-btn">Submit Answer</button>

            <p id="feedback"></p>
        </section>
    </main>

    <footer>
        <p>AnimeVerse Quiz | Test your knowledge</p>
    </footer>

</body>
</html>
